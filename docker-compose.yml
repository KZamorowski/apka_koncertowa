name: koncertowy_crud
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://student:haslo123@db:5432/koncerty
    depends_on:
      db:
        condition: service_healthy  # Czekamy na zielone światło od bazy!

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: haslo123
      POSTGRES_DB: koncerty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Pukamy do bazy co 5 sekund, żeby sprawdzić czy żyje
      test: ["CMD-SHELL", "pg_isready -U student -d koncerty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: